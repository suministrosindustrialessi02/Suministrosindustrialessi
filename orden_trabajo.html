<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orden de Trabajo</title>
<style>
:root{ --azul:#1f3864; --azul-claro:#d9e2f3; --gris:#555; --borde:#222; --ok:#1b7a34; --rojo:#b91c1c; --amarillo:#fff3cd; }
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#eef1f6;font-size:13px}
.barra{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barra h1{font-size:1rem;margin:0 auto 0 0}
.btn{border:0;border-radius:6px;padding:9px 14px;font-size:.85rem;font-weight:bold;cursor:pointer;background:#fff;color:var(--azul)}
.btn.verde{background:#2e9e4f;color:#fff}.btn.rojo{background:#c0392b;color:#fff}.btn.gris{background:#e3e7ee;color:#222}
.btn:disabled{opacity:.5;cursor:not-allowed}
.contenedor{max-width:900px;margin:14px auto;padding:0 10px 60px}
.aviso{border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:.85rem;line-height:1.4}
.aviso.amar{background:var(--amarillo);color:#7a5b00}.aviso.roj{background:#fdecea;color:#991b1b}.aviso.ver{background:#e6f4eb;color:#1b5e2e}.aviso.azu{background:#e8eefb;color:#1f3864}
.editor{background:#fff;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.editor h3{margin:0 0 8px;font-size:.95rem;color:var(--azul)}
.editor label{display:block;font-size:.75rem;font-weight:bold;color:var(--gris);margin:8px 0 3px}
.editor input,.editor textarea,.editor select{width:100%;padding:8px;border:1px solid #bbb;border-radius:5px;font:inherit}
.editor textarea{min-height:60px;resize:vertical}
.fila-ed{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.fila-ed .num{width:26px;padding-top:9px;font-weight:bold;text-align:center}
.fila-ed select.tipo{width:110px;flex:none}
.fila-ed .mini{width:70px;flex:none}
.x{border:0;background:#fdecea;color:#991b1b;border-radius:5px;padding:8px 10px;cursor:pointer;font-weight:bold}
.mov{border:0;background:#e3e7ee;border-radius:5px;padding:8px 8px;cursor:pointer}
/* ===== DOCUMENTO ===== */
.hoja{background:#fff;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.2)}
table.wrap{width:100%;border-collapse:collapse}
table.wrap>thead{display:table-header-group}
table{border-collapse:collapse}
.hd{width:100%;border:1.5px solid var(--borde)}
.hd td{border:1px solid var(--borde);padding:4px 6px;font-size:11px}
.hd .logo{width:20%;text-align:center}.hd .logo img{width:64px}
.hd .tit{text-align:center;font-weight:bold;font-size:20px;width:55%}
.hd .sub{text-align:center;font-weight:bold;font-size:12px;background:#fff}
.hd .lbl{background:var(--azul-claro);font-weight:bold;text-align:center;font-size:10px}
.hd .val{font-weight:bold;text-align:center}
.eq{width:100%;border:1.5px solid var(--borde);margin-top:-1px}
.eq td{border:1px solid var(--borde);padding:3px 6px;font-size:11px}
.eq td.l{background:var(--azul-claro);font-weight:bold;text-align:center;font-size:10px;width:9%}
.eq td.v{font-weight:bold;text-align:center}
.sec{margin-top:12px;border:1.5px solid var(--borde)}
.sec>.t{background:var(--azul);color:#fff;font-weight:bold;font-size:12px;padding:4px 8px;text-transform:uppercase}
.sec .b{padding:8px 10px;font-size:12px;line-height:1.45;white-space:pre-wrap}
table.g{width:100%}
table.g th{background:var(--azul-claro);font-size:10px;text-transform:uppercase;border:1px solid var(--borde);padding:4px}
table.g td{border:1px solid var(--borde);padding:5px 6px;font-size:12px;vertical-align:top}
table.g td.c{text-align:center}
tr{page-break-inside:avoid}
.chk{font-size:18px;line-height:1}
.printonly{display:none}
@media print{.printonly{display:inline}}
.hecho{background:#e6f4eb}
.firmas{display:flex;border-top:1px solid var(--borde)}
.firmas>div{flex:1;border-right:1px solid var(--borde);text-align:center;padding:6px 8px;min-height:170px}
.firmas>div:last-child{border-right:0}
.firmas .rol{font-weight:bold;font-size:11px;background:var(--azul-claro);margin:-6px -8px 6px;padding:4px;border-bottom:1px solid var(--borde)}
.firmas img.tr{height:70px;max-width:95%}
.firmas .linea{border-top:1px solid #000;margin:4px 14px 2px}
.firmas .peq{font-size:10px;color:#444}
.firmas .vacia{height:70px;display:flex;align-items:center;justify-content:center;color:#b91c1c;font-size:11px;font-weight:bold}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:0}
.fotos figure{margin:0;border:1px solid var(--borde);text-align:center;padding:4px}
.fotos img{max-width:100%;max-height:210px;object-fit:contain}
.fotos figcaption{font-size:10px;background:#f0f0f0;padding:2px}
.pie{margin-top:10px;font-size:9px;color:#444;display:flex;justify-content:space-between}
/* modal firma */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:10px}
.modal.abierto{display:flex}
.modal .caja{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:560px}
.modal canvas{width:100%;height:auto;border:2px dashed #888;border-radius:6px;touch-action:none;background:#fcfcfc}
.cards{display:none}
.card-t{display:flex;gap:10px;align-items:flex-start;border:1px solid #333;border-radius:8px;padding:12px;margin:8px;background:#fff}
.card-t.hecho{background:#e6f4eb}
.card-t .n{font-weight:bold;min-width:20px}
.card-t input{width:30px;height:30px;flex:none}
.card-t .tx{flex:1;font-size:14px;line-height:1.4}.card-t .tx small{display:block;color:#555;font-size:11px;margin:2px 0}
.tarjeta{display:block;background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.15);text-decoration:none;color:#111}
.tarjeta b{color:#1f3864}.tarjeta small{color:#555}
.lista-t{font-weight:bold;margin:14px 0 6px;color:#1f3864}
@media(max-width:700px){
  .cards{display:block}table.tareas{display:none}
  .hoja{overflow-x:auto;padding:6px}
  .btn{padding:12px 14px;font-size:.9rem}
  .barra{padding:8px 10px}
  .modal{padding:0;align-items:stretch}.modal .caja{max-width:none;border-radius:0;display:flex;flex-direction:column;justify-content:center}
}
@page{size:letter;margin:11mm 9mm 15mm;@bottom-center{content:"Hoja " counter(page) " de " counter(pages);font-size:9px}}
@media print{
  .cards{display:none!important}table.tareas{display:table!important}
  body{background:#fff}.noprint,.barra,.editor,.aviso{display:none!important}
  .contenedor{max-width:none;margin:0;padding:0}.hoja{box-shadow:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:640px){.hd .tit{font-size:14px}.fila-ed{flex-wrap:wrap}.fotos{grid-template-columns:1fr}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="iconos/iconos-si.css">
<style id="estiloRediseno">
/* REDISEÑO 2026-11 — solo pantalla. El documento y la impresión/PDF no usan nada de este bloque. */
@media screen{
:root{ --rd-fondo:#f4f6fa; --rd-borde:#e3e8ef; --rd-borde-2:#cfd7e3; --rd-texto:#1a2433; --rd-texto-2:#5b6778; --rd-texto-3:#8a95a5;
  --rd-hover:#eef1f5; --rd-azul:#12325a; --rd-azul-2:#1d5496; --rd-azul-bg:#e8f0fb; --rd-sombra:0 1px 2px rgba(16,24,40,.05); }
body{ background:var(--rd-fondo); }
.barra,.aviso,.editor,.tarjeta,.lista-t,.modal,.btn,.card-t{ font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif; }

/* Barra superior */
.barra{ background:#fff; color:var(--rd-texto); border-bottom:1px solid var(--rd-borde); padding:10px 24px; gap:12px; min-height:62px; align-items:center; }
.rd-logo{ height:32px; width:auto; display:block; flex:none; }
.rd-tit{ margin-right:auto; min-width:0; display:flex; flex-direction:column; }
.rd-kicker{ font-size:11px; color:var(--rd-texto-3); letter-spacing:.05em; text-transform:uppercase; }
.barra h1{ font-size:16px; font-weight:600; margin:0; color:var(--rd-texto); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#botones{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
#botones:empty{ display:none; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 14px; border-radius:8px; border:1px solid var(--rd-borde-2); background:#fff; color:var(--rd-texto); font-size:13px; font-weight:500; white-space:nowrap; }
.btn:hover{ background:var(--rd-hover); }
.btn i{ font-size:17px; }
.btn.gris{ background:#fff; color:var(--rd-texto); }
.btn.verde{ background:var(--rd-azul); border-color:var(--rd-azul); color:#fff; }
.btn.verde:hover{ background:#0c1e35; }
.btn.rojo{ background:#b42318; border-color:#b42318; color:#fff; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* Avisos */
.aviso{ border-radius:10px; padding:12px 16px; border:1px solid transparent; font-size:13.5px; line-height:1.5; margin-bottom:10px; }
.aviso.amar{ background:#fdf3e1; color:#7a4b00; border-color:#f1dfae; }
.aviso.roj{ background:#fdecea; color:#8f1d12; border-color:#f3c5c0; }
.aviso.ver{ background:#e6f4ec; color:#0b5d2e; border-color:#bfe3cd; }
.aviso.azu{ background:#e8f0fb; color:#12325a; border-color:#c9dbf3; }
.aviso a{ color:inherit; font-weight:600; }

/* Editor del borrador */
.editor{ border-radius:12px; border:1px solid var(--rd-borde); box-shadow:var(--rd-sombra); padding:18px; margin-bottom:16px; }
.editor h3{ font-size:15px; font-weight:600; color:var(--rd-texto); margin:0 0 4px; }
.editor label{ font-size:12px; font-weight:600; color:var(--rd-texto-2); margin:16px 0 6px; }
.editor input,.editor textarea,.editor select{ border:1px solid var(--rd-borde-2); border-radius:8px; padding:9px 11px; font-size:14px; color:var(--rd-texto); background:#fff; font-family:inherit; }
.editor input:focus,.editor textarea:focus,.editor select:focus{ outline:none; border-color:#2563a8; box-shadow:0 0 0 3px rgba(37,99,168,.12); }
.fila-ed{ gap:8px; margin-bottom:8px; }
.fila-ed .num{ color:var(--rd-texto-3); font-weight:600; }
.x,.mov{ width:36px; height:36px; padding:0; border-radius:8px; display:inline-grid; place-items:center; flex:none; font-size:13px; }
.x{ background:#fdecea; color:#b42318; border:1px solid #f3c5c0; }
.mov{ background:#fff; color:var(--rd-texto-2); border:1px solid var(--rd-borde-2); }
.mov:hover{ background:var(--rd-hover); }

/* Lista "Mis órdenes de trabajo" */
.lista-t{ font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--rd-texto-2); margin:22px 0 8px; }
.tarjeta{ position:relative; padding:14px 44px 14px 16px; border:1px solid var(--rd-borde); border-radius:12px; box-shadow:var(--rd-sombra); margin-bottom:10px; }
.tarjeta:hover{ border-color:#b8d0ee; box-shadow:0 4px 14px rgba(16,24,40,.08); }
.tarjeta::after{ content:"\ea61"; font-family:"tabler-icons"; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--rd-texto-3); font-size:18px; }
.tarjeta b{ color:var(--rd-azul-2); font-weight:600; font-size:14.5px; }
.tarjeta small{ color:var(--rd-texto-2); font-size:12.5px; line-height:1.7; }

/* Marco del documento en pantalla (el documento por dentro no cambia) */
.hoja{ border-radius:12px; border:1px solid var(--rd-borde); box-shadow:var(--rd-sombra); }

/* Actividades en tarjetas (celular) */
.card-t{ border:1px solid var(--rd-borde-2); border-radius:12px; }
.card-t.hecho{ background:#e6f4ec; border-color:#bfe3cd; }
.card-t .n{ color:var(--rd-azul-2); }
.card-t input{ accent-color:#0e7a3c; }

/* Ventana de firma */
.modal{ background:rgba(12,30,53,.5); }
.modal .caja{ border-radius:14px; padding:20px; box-shadow:0 20px 50px rgba(16,24,40,.25); }
.modal .caja h3{ font-size:17px; font-weight:600; color:var(--rd-texto) !important; }
.modal .caja p{ color:var(--rd-texto-2) !important; line-height:1.5; }
.modal canvas{ border:2px dashed var(--rd-borde-2); border-radius:10px; background:#fcfcfd; }

/* Celular */
@media (max-width:700px){
  .barra{ padding:8px 12px; gap:8px; min-height:54px; }
  .rd-logo{ height:26px; }
  .rd-kicker,.rd-lbl{ display:none; }
  .barra h1{ font-size:14px; }
  #botones:not(:empty){ position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:1px solid var(--rd-borde); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -4px 16px rgba(16,24,40,.08); }
  #botones .btn{ flex:1 1 auto; height:44px; font-size:14px; padding:0 12px; }
  .contenedor{ padding-bottom:120px; }
  .editor{ padding:14px; }
}
}
</style>
</head>
<body>
<div class="barra noprint">
  <button class="btn gris" onclick="volver()" aria-label="Volver"><i class="ti ti-arrow-left"></i><span class="rd-lbl">Volver</span></button>
  <img class="rd-logo" src="logo_SI.jpg" alt="Suministros Industriales SI">
  <div class="rd-tit">
    <span class="rd-kicker">Orden de trabajo · Centro de Servicio</span>
    <h1 id="tituloBarra">Orden de Trabajo</h1>
  </div>
  <span id="botones"></span>
</div>
<div class="contenedor">
  <div id="avisos" class="noprint"></div>
  <div id="editor"></div>
  <div id="doc"></div>
</div>

<div class="modal" id="modalFirma">
  <div class="caja">
    <h3 id="firmaTitulo" style="margin:0 0 4px;color:#1f3864">Firmar</h3>

    <canvas id="pad" width="720" height="260"></canvas>
    <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
      <button class="btn gris" onclick="limpiarPad()">Borrar</button>
      <button class="btn gris" onclick="cerrarFirma()">Cancelar</button>
      <button class="btn verde" id="btnConfirmarFirma" onclick="confirmarFirma()">Firmar</button>
    </div>
  </div>
</div>

async function sha(s){
  try{ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))|0; return "f"+(h>>>0).toString(16); }
}

  el.innerHTML = `<div class="aviso azu">Cargando…</div>`;
  try{
    const r = await apiGet(`/.netlify/functions/airtable?table=${T_OT}&filterByFormula=${encodeURIComponent('OR({estado}="Borrador",{estado}="Firmada")')}&returnFieldsByFieldId=true`);
    const filas = (r.records||[]).map(rec => {
      let c = {}, fi = {}; try{ c = JSON.parse(rec.fields[T.contenido]||"{}"); }catch(e){} try{ fi = JSON.parse(rec.fields[T.firmas]||"{}"); }catch(e){}
      const st = sv(rec.fields[T.estado]); const tec = rec.fields[T.tecnico] || c.tecnico || "";
      const mio = norm(tec) === norm(meNombre);
      let grupo = "otras", etiqueta = st;
      if(st === "Borrador" && !fi.encargado && esEncargado){ grupo = "firma"; etiqueta = "Por firmar (encargado)"; }
      else if(st === "Borrador" && fi.encargado && !fi.tecnico && mio){ grupo = "firma"; etiqueta = "Por firmar (técnico)"; }
      else if(st === "Firmada" && (mio || esEncargado || _sesion.rol === "Admin")){ grupo = "ejec"; etiqueta = "En ejecución"; }
      else if(!puedeEditar && !mio) grupo = null;
      return { id: rec.fields[T.ordenId], folio: rec.fields[T.folioOT], cliente: (c.equipo||{}).cliente||"", equipo: [(c.equipo||{}).tipoEquipo,(c.equipo||{}).marca].filter(Boolean).join(" "), tec, grupo, etiqueta,
        hechas: (c.tareas||[]).length ? "" : "" };
    }).filter(x => x.grupo);
    const sec = (g, titulo) => { const l = filas.filter(x => x.grupo === g); return l.length ? `<div class="lista-t">${titulo}</div>` + l.map(x => `<a class="tarjeta" href="?id=${encodeURIComponent(x.id)}"><b>${esc(x.folio)}</b> · ${esc(x.etiqueta)}<br><small>${esc(x.cliente)} · ${esc(x.equipo)} · Técnico: ${esc(x.tec||"sin asignar")}</small></a>`).join("") : ""; };
    const html = sec("firma","Requieren tu firma") + sec("ejec","En ejecución") + sec("otras","Otras órdenes de trabajo");
    el.innerHTML = html || `<div class="aviso ver">No tienes órdenes de trabajo pendientes.</div>`;
  }catch(e){ el.innerHTML = `<div class="aviso roj">No se pudo cargar: ${esc(e.message)}</div>`; }
}

async function seleccionar(rec){
  ot = rec;
  if(ot){
    try{ C = JSON.parse(ot.fields[T.contenido] || "{}"); }catch(e){ C = {}; }
    try{ F = JSON.parse(ot.fields[T.firmas] || "{}"); }catch(e){ F = {}; }
    try{ EJ = JSON.parse(ot.fields[T.ejec] || "{}"); }catch(e){ EJ = {}; }
  } else { C = null; F = {}; EJ = {}; }
  cambiosSinGuardar = false;
  await pintar();
}

const estadoOT = () => ot ? sv(ot.fields[T.estado]) : "";
const tecnicoAsignado = () => (C && C.tecnico) || (ot && ot.fields[T.tecnico]) || "";
const editable = () => ot && estadoOT() === "Borrador" && !F.encargado && puedeEditar;
const firmadaCompleta = () => estadoOT() === "Firmada" || estadoOT() === "Cerrada";

/* ============================================================
   GENERAR DESDE DIAGNÓSTICO
   ============================================================ */
function generarContenido(){
  const d = diag || {};
  const equipo = {
    folio: orden[O.folio] || d.folio || "", cliente: orden[O.cliente] || d.cliente || "", usuario: orden[O.usuario] || d.usuario || "",
    tipoEquipo: sv(orden[O.tipoEquipo]) || d.tipoEquipo || "", marca: d.marca || "", nombreCorto: d.nombreCorto || "",
    hp: orden[O.hp] != null ? orden[O.hp] : (d.potencia || ""), frame: orden[O.frame] || d.frame || "", spec: orden[O.spec] || d.spec || "",
    serie: orden[O.serie] || d.numSerie || "", volts: orden[O.volts] != null ? orden[O.volts] : (d.volts || "")
  };
  const hallazgos = [];
  if(d.descripcionProblema) hallazgos.push({ titulo:"Descripción del problema", texto:d.descripcionProblema });
  const obs = (d.observaciones||[]).filter(Boolean);
  if(obs.length) hallazgos.push({ titulo:"Observaciones", texto: obs.map((x,i)=>`${i+1}. ${x}`).join("\n") });
  if(d.diagnosticoTecnico) hallazgos.push({ titulo:"Diagnóstico técnico", texto:d.diagnosticoTecnico });
  const tareas = (d.serviciosPropuestos||[]).filter(Boolean).map(s => ({ id:uid(), tipo:"Servicio", texto:s }));
  tareas.push({ id:uid(), tipo:"Control", texto:"Verificar que los datos de placa del equipo coincidan con esta orden antes de intervenir." });
  if(d.aplicaElectrico) tareas.push({ id:uid(), tipo:"Control", texto:"Repetir las pruebas eléctricas al terminar y comparar contra las iniciales del diagnóstico." });
  tareas.push({ id:uid(), tipo:"Control", texto:"Tomar evidencias fotográficas del proceso (antes / durante / después)." });
  tareas.push({ id:uid(), tipo:"Control", texto:"Prueba de funcionamiento y limpieza final." });
  const materiales = (d.materialesPropuestos||[]).filter(m => m && m.descripcion).map(m => ({ cantidad:m.cantidad||"", unidad:m.unidad||"", descripcion:m.descripcion||"", nota:m.nota||"" }));
  return {
    equipo, hallazgos, tareas, materiales,
    fechaDiagnostico: d.fecha || "",
    objetivo: `Intervenir ${equipo.tipoEquipo||"equipo"}${equipo.marca?" "+equipo.marca:""}${equipo.hp?" de "+equipo.hp+" HP":""} conforme al diagnóstico técnico${d.fecha?" del "+fmtD(d.fecha):""}. Este documento es una base y un apoyo para el técnico: resume lo que se encontró en el diagnóstico y lo que se planea hacer.`,
    fueraAlcance: "", tecnico: orden[O.tecnico] || ""
  };
}

async function crearOT(revision){
  if(!orden[O.diag]){ alert("Esta orden todavía no tiene diagnóstico. Primero el técnico debe generarlo."); return; }
  const cont = generarContenido();
  const folio = cont.equipo.folio || ordenId;
  const f = {
    [T.folioOT]: `OT-${folio}${revision>1?" R"+revision:""}`, [T.ordenId]: ordenId, [T.folioEq]: folio, [T.rev]: revision, [T.estado]: "Borrador",
    [T.contenido]: JSON.stringify(cont), [T.hashC]: await sha(JSON.stringify(cont)), [T.hashD]: hashDiagActual, [T.firmas]: "{}", [T.ejec]: "{}",
    [T.tecnico]: cont.tecnico, [T.creadoPor]: meNombre, [T.fecha]: new Date().toISOString()
  };
  const rec = await apiPost(T_OT, f);
  return rec;
}

async function generarPrimera(){
  try{
    const rec = await crearOT(1);
    if(!rec) return;
    ots.unshift(rec); await seleccionar(rec);
  }catch(e){ alert(e.message); }
}

async function nuevaRevision(){
  if(!ot) return;
  const msg = estadoOT()==="Borrador" && !F.encargado
    ? "Se creará una revisión nueva desde el diagnóstico actual y esta se marcará como obsoleta."
    : "Esta OT ya está firmada. Se creará una revisión nueva desde el diagnóstico actual, esta quedará OBSOLETA y habrá que firmar de nuevo.";
  if(!confirm(msg + "\n\n¿Continuar?")) return;
  try{
    const rev = (ot.fields[T.rev]||1) + 1;
    const nuevo = await crearOT(rev);
    await apiPatch(T_OT, ot.id, { [T.estado]: "Obsoleta" });
    ot.fields[T.estado] = "Obsoleta";
    ots.unshift(nuevo); await seleccionar(nuevo);
  }catch(e){ alert(e.message); }
}

/* ============================================================
   GUARDAR / FIRMAR / EJECUTAR
   ============================================================ */
async function guardarBorrador(silencioso){
  if(!editable()) return true;
  C.tecnico = (document.getElementById("selTecnico")||{}).value ?? C.tecnico;
  try{
    const h = await sha(JSON.stringify(C));
    await apiPatch(T_OT, ot.id, { [T.contenido]: JSON.stringify(C), [T.hashC]: h, [T.tecnico]: C.tecnico || "" });
    ot.fields[T.contenido] = JSON.stringify(C); ot.fields[T.hashC] = h; ot.fields[T.tecnico] = C.tecnico || "";
    cambiosSinGuardar = false;
    if(!silencioso) alert("Borrador guardado.");
    pintarBotones();
    return true;
  }catch(e){ alert(e.message); return false; }
}

let firmaRol = null;
function pedirFirma(rol){
  if(rol === "encargado"){
    if(!esEncargado){ alert("Solo el encargado del centro de servicio ("+ENCARGADO.nombre+") puede firmar aquí."); return; }
    if(!(C.tareas||[]).some(t => (t.texto||"").trim())){ alert("Agrega al menos una actividad antes de firmar."); return; }
    if(!tecnicoAsignado()){ alert("Selecciona el técnico que realizará el trabajo."); return; }
  } else {
    if(!F.encargado){ alert("Primero debe firmar el encargado."); return; }
    if(norm(meNombre) !== norm(tecnicoAsignado())){ alert("Solo el técnico asignado ("+tecnicoAsignado()+") puede firmar como operador."); return; }
  }
  firmaRol = rol;
  document.getElementById("firmaTitulo").textContent = rol === "encargado" ? "Firma del encargado" : "Firma del técnico";
  document.getElementById("firmaTexto").textContent = rol === "encargado"
    ? "Al firmar confirmas que revisaste las actividades y materiales de esta orden. Después de firmar ya no se puede editar (solo con una nueva revisión)."
    : "Al firmar confirmas que leíste esta orden y que solo harás lo indicado en ella.";
  document.getElementById("modalFirma").classList.add("abierto");
  iniciarPad();
}
function cerrarFirma(){ document.getElementById("modalFirma").classList.remove("abierto"); }

let padCtx, dibujando = false, trazos = 0;
function iniciarPad(){
  const cv = document.getElementById("pad"); padCtx = cv.getContext("2d");
  padCtx.clearRect(0,0,cv.width,cv.height); padCtx.lineWidth = 2.6; padCtx.lineCap = "round"; padCtx.lineJoin = "round"; padCtx.strokeStyle = "#0a1f5c"; trazos = 0;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height }; };
  cv.onpointerdown = e => { dibujando = true; cv.setPointerCapture(e.pointerId); const p = pos(e); padCtx.beginPath(); padCtx.moveTo(p.x,p.y); padCtx.lineTo(p.x+.1,p.y+.1); padCtx.stroke(); trazos++; e.preventDefault(); };
  cv.onpointermove = e => { if(!dibujando) return; const p = pos(e); padCtx.lineTo(p.x,p.y); padCtx.stroke(); trazos++; e.preventDefault(); };
  cv.onpointerup = cv.onpointercancel = () => { dibujando = false; };
}
function limpiarPad(){ const cv = document.getElementById("pad"); padCtx.clearRect(0,0,cv.width,cv.height); trazos = 0; }

async function confirmarFirma(){
  if(trazos < 15){ alert("Dibuja tu firma en el recuadro."); return; }
  const trazo = document.getElementById("pad").toDataURL("image/png");
  const btn = document.getElementById("btnConfirmarFirma"); btn.disabled = true;
  try{
    const ahora = new Date().toISOString();
    if(firmaRol === "encargado"){
      if(!await guardarBorrador(true)) { btn.disabled = false; return; }
      const hash = await sha(JSON.stringify(C));
      F.encargado = { nombre: ENCARGADO.nombre, firmante: meNombre, usuario: _sesion.usuario||"", fecha: ahora, trazo, hash };
      if(norm(tecnicoAsignado()) === norm(meNombre) || (ENCARGADO.coincide(tecnicoAsignado()) && ENCARGADO.coincide(meNombre))){
        F.tecnico = { nombre: tecnicoAsignado(), firmante: meNombre, usuario: _sesion.usuario||"", fecha: ahora, trazo, hash, mismaPersona:true };
      }
    } else {
      const hash = await sha(JSON.stringify(C));
      F.tecnico = { nombre: tecnicoAsignado(), firmante: meNombre, usuario: _sesion.usuario||"", fecha: ahora, trazo, hash };
    }
    const completa = !!(F.encargado && F.tecnico);
    const campos = { [T.firmas]: JSON.stringify(F) };
    if(completa) campos[T.estado] = "Firmada";
    await apiPatch(T_OT, ot.id, campos);
    ot.fields[T.firmas] = campos[T.firmas]; if(completa) ot.fields[T.estado] = "Firmada";
    cerrarFirma(); await pintar();
  }catch(e){ alert(e.message); }
  btn.disabled = false;
}

async function marcarTarea(id, el){
  if(estadoOT() !== "Firmada") return;
  const puede = norm(meNombre) === norm(tecnicoAsignado()) || esEncargado || _sesion.rol === "Admin";
  if(!puede){ el.checked = !el.checked; alert("Solo el técnico asignado puede marcar actividades."); return; }
  if(el.checked) EJ[id] = { por: meNombre, fecha: new Date().toISOString() }; else delete EJ[id];
  try{ await apiPatch(T_OT, ot.id, { [T.ejec]: JSON.stringify(EJ) }); ot.fields[T.ejec] = JSON.stringify(EJ); await pintar(); }
  catch(e){ alert(e.message); el.checked = !el.checked; }
}

async function cerrarOT(){
  const pend = (C.tareas||[]).filter(t => !EJ[t.id]);
  if(pend.length){ alert("Faltan por marcar "+pend.length+" actividad(es)."); return; }
  if(!confirm("¿Cerrar la OT? Confirma que todo lo indicado se realizó.")) return;
  EJ._cierre = { por: meNombre, fecha: new Date().toISOString() };
  try{ await apiPatch(T_OT, ot.id, { [T.ejec]: JSON.stringify(EJ), [T.estado]: "Cerrada" }); ot.fields[T.ejec] = JSON.stringify(EJ); ot.fields[T.estado] = "Cerrada"; await pintar(); }
  catch(e){ alert(e.message); }
}

/* ============================================================
   PINTAR
   ============================================================ */
async function pintar(){
  pintarAvisos(); pintarEditor(); pintarDoc(); pintarBotones();
  document.getElementById("tituloBarra").textContent = ot ? `${ot.fields[T.folioOT]} · ${estadoOT()}` : "Orden de Trabajo";
}

function pintarAvisos(){
  const a = [];
  if(!ot){
    a.push(orden[O.diag]
      ? `<div class="aviso azu"><b>Esta orden todavía no tiene Orden de Trabajo.</b> Se genera automáticamente con las actividades, materiales y hallazgos del diagnóstico; después el encargado la revisa y la firma.</div>`
      : `<div class="aviso amar">Esta orden aún no tiene diagnóstico. La OT se genera a partir del diagnóstico del técnico.</div>`);
  } else {
    const st = estadoOT();
    if(st === "Obsoleta") a.push(`<div class="aviso roj"><b>OBSOLETA.</b> Existe una revisión más nueva. No trabajes con este documento.</div>`);
    if(st !== "Obsoleta" && st !== "Cerrada" && ot.fields[T.hashD] && ot.fields[T.hashD] !== hashDiagActual)
      a.push(`<div class="aviso roj"><b>⚠ El diagnóstico cambió después de generar esta OT.</b> Genera una nueva revisión para que el documento coincida con el diagnóstico vigente.</div>`);
    if(F.encargado && ot.fields[T.hashC] && F.encargado.hash && F.encargado.hash !== ot.fields[T.hashC])
      a.push(`<div class="aviso roj"><b>⚠ El contenido no coincide con lo que se firmó.</b> No uses este documento; genera una nueva revisión.</div>`);
    if(st === "Borrador" && !F.encargado) a.push(`<div class="aviso amar">Borrador sin firmar. El técnico no debe intervenir el equipo hasta que esté firmada.</div>`);
    if(st === "Borrador" && F.encargado && !F.tecnico) a.push(`<div class="aviso amar">Firmada por el encargado. Falta la firma del técnico <b>${esc(tecnicoAsignado())}</b>.</div>`);
    if(st === "Firmada") a.push(`<div class="aviso ver">✔ Orden firmada y vigente. Contenido firmado: para cambiar la orden se crea una nueva revisión.</div>`);
    if(st === "Cerrada") a.push(`<div class="aviso ver">✔ OT cerrada${EJ._cierre?" el "+esc(fmtF(EJ._cierre.fecha))+" por "+esc(EJ._cierre.por):""}.</div>`);
    const vm = sv(orden[O.valMat]);
    if(vm === "Pendiente") a.push(`<div class="aviso amar">La lista de materiales aún no ha sido validada por Dirección.</div>`);
    if(vm === "Rechazado") a.push(`<div class="aviso roj">Dirección rechazó la lista de materiales. Revisa el diagnóstico.</div>`);
    if(ots.length > 1){
      a.push(`<div class="aviso azu">Revisiones: ${ots.map(r => `<a href="?id=${encodeURIComponent(ordenId)}&rev=${r.fields[T.rev]}">R${r.fields[T.rev]} (${esc(sv(r.fields[T.estado]))})</a>`).join(" · ")}</div>`);
    }
  }
  document.getElementById("avisos").innerHTML = a.join("");
}

function pintarBotones(){
  const b = [];
  if(!ot){ if(puedeEditar && orden[O.diag]) b.push(`<button class="btn verde" onclick="generarPrimera()"><i class="ti ti-settings"></i>Generar OT desde diagnóstico</button>`); }
  else {
    const st = estadoOT();
    if(editable()){
      b.push(`<button class="btn gris" onclick="guardarBorrador()"><i class="ti ti-device-floppy"></i>Guardar borrador</button>`);
    }
    if(st === "Borrador" && !F.encargado && esEncargado) b.push(`<button class="btn verde" onclick="pedirFirma('encargado')"><i class="ti ti-signature"></i>Firmar (encargado)</button>`);
    if(st === "Borrador" && F.encargado && !F.tecnico && norm(meNombre) === norm(tecnicoAsignado())) b.push(`<button class="btn verde" onclick="pedirFirma('tecnico')"><i class="ti ti-signature"></i>Firmar (técnico)</button>`);
    if(st === "Firmada" && (norm(meNombre) === norm(tecnicoAsignado()) || esEncargado || _sesion.rol==="Admin")) b.push(`<button class="btn verde" onclick="cerrarOT()"><i class="ti ti-check"></i>Cerrar OT</button>`);
    if(puedeEditar && st !== "Obsoleta" && st !== "Cerrada") b.push(`<button class="btn gris" onclick="nuevaRevision()"><i class="ti ti-refresh"></i>Nueva revisión</button>`);
    b.push(`<button class="btn" onclick="window.print()"><i class="ti ti-file-type-pdf"></i>Guardar PDF</button>`);
  }
  document.getElementById("botones").innerHTML = b.join(" ");
}

function pintarEditor(){
  const el = document.getElementById("editor");
  if(!ot || !editable()){ el.innerHTML = ""; return; }
  const tareas = (C.tareas||[]).map((t,i) => `
    <div class="fila-ed">
      <div class="num">${i+1}</div>
      <select class="tipo" onchange="C.tareas[${i}].tipo=this.value;pintarDoc()">${["Servicio","Control"].map(x=>`<option ${t.tipo===x?"selected":""}>${x}</option>`).join("")}</select>
      <textarea oninput="C.tareas[${i}].texto=this.value;pintarDoc()">${esc(t.texto)}</textarea>
      <button class="mov" onclick="moverTarea(${i},-1)">▲</button><button class="mov" onclick="moverTarea(${i},1)">▼</button>
      <button class="x" onclick="quitarTarea(${i})">✕</button>
    </div>`).join("");
  const mats = (C.materiales||[]).map((m,i) => `
    <div class="fila-ed">
      <input class="mini" placeholder="Cant." value="${esc(m.cantidad)}" oninput="C.materiales[${i}].cantidad=this.value;pintarDoc()">
      <input class="mini" placeholder="Unidad" value="${esc(m.unidad)}" oninput="C.materiales[${i}].unidad=this.value;pintarDoc()">
      <input placeholder="Descripción" value="${esc(m.descripcion)}" oninput="C.materiales[${i}].descripcion=this.value;pintarDoc()">
      <button class="x" onclick="quitarMat(${i})">✕</button>
    </div>`).join("");
  const opcTec = [...new Set([...(C.tecnico?[C.tecnico]:[]), ...tecnicos])];
  el.innerHTML = `
    <div class="editor">
      <h3>Revisión del borrador (solo el encargado / administración)</h3>
      <label>Objetivo (el aviso de que la orden es solo una guía se agrega automáticamente)</label>
      <textarea oninput="C.objetivo=this.value;pintarDoc()">${esc(C.objetivo)}</textarea>
      <label>Técnico que realizará el trabajo</label>
      <select id="selTecnico" onchange="C.tecnico=this.value;pintarDoc();pintarBotones()"><option value="">— Selecciona —</option>${opcTec.map(n=>`<option ${norm(n)===norm(C.tecnico)?"selected":""} value="${esc(n)}">${esc(n)}</option>`).join("")}</select>
      <label>Actividades (en el orden en que se harán)</label>
      ${tareas}
      <button class="btn gris" onclick="C.tareas.push({id:uid(),tipo:'Servicio',texto:''});pintarEditor();pintarDoc()">+ Actividad</button>
      <label>Materiales</label>
      ${mats}
      <button class="btn gris" onclick="C.materiales.push({cantidad:'',unidad:'',descripcion:'',nota:''});pintarEditor();pintarDoc()">+ Material</button>
      <label>Indicaciones específicas: qué NO hacer (opcional)</label>
      <textarea oninput="C.fueraAlcance=this.value;pintarDoc()">${esc(C.fueraAlcance)}</textarea>
    </div>`;
}
function moverTarea(i,d){ const j=i+d; if(j<0||j>=C.tareas.length) return; [C.tareas[i],C.tareas[j]]=[C.tareas[j],C.tareas[i]]; pintarEditor(); pintarDoc(); }
function quitarTarea(i){ C.tareas.splice(i,1); pintarEditor(); pintarDoc(); }
function quitarMat(i){ C.materiales.splice(i,1); pintarEditor(); pintarDoc(); }

function fotosRef(){
  const fs = [];
  (orden[O.fotosPlaca]||[]).slice(0,2).forEach((a,i) => fs.push({ url:(a.thumbnails&&a.thumbnails.large&&a.thumbnails.large.url)||a.url, cap:"Placa de datos del equipo" }));
  (orden[O.fotosDiagTec]||[]).slice(0,4).forEach((a,i) => fs.push({ url:(a.thumbnails&&a.thumbnails.large&&a.thumbnails.large.url)||a.url, cap:"Diagnóstico — foto "+(i+1) }));
  return fs;
}

function bloqueFirma(rol, titulo, puesto, nombreFijo){
  const f = F[rol];
  const nombre = nombreFijo || (f && f.nombre) || "";
  const extra = f && f.firmante && norm(nomVis(f.firmante)) !== norm(nomVis(f.nombre)) ? `<div class="peq">Firmó en suplencia: ${esc(f.firmante)}</div>` : "";
  return `<div>
    <div class="rol">${esc(titulo)}</div>
    ${f ? `<img class="tr" src="${f.trazo}" alt="firma">` : `<div class="vacia">SIN FIRMAR</div>`}
    <div class="linea"></div>
    <div><b>${esc(nombre)}</b></div><div class="peq">${esc(puesto)}</div>
    <div class="peq">${f ? "Fecha: "+esc(fmtF(f.fecha)) : "Fecha: ____ / ____ / ______"}</div>
    ${f ? `<div class="peq">Sello: ${esc((f.hash||"").slice(0,10))}</div>` : ""}${extra}
  </div>`;
}

function pintarDoc(){
  const el = document.getElementById("doc");
  if(!ot || !C){ el.innerHTML = ""; return; }
  const q = C.equipo || {};
  const st = estadoOT();
  const folioOT = ot.fields[T.folioOT] || "";
  const fechaOT = fmtD(ot.fields[T.fecha] || new Date().toISOString());
  const ejecutable = st === "Firmada";
  const filasT = (C.tareas||[]).filter(t => (t.texto||"").trim()).map((t,i) => {
    const e = EJ[t.id];
    return `<tr class="${e?"hecho":""}"><td class="c"><b>${i+1}</b></td><td class="c">${esc(t.tipo)}</td><td>${esc(t.texto)}</td>
      <td class="c">${ejecutable ? `<input type="checkbox" class="noprint" ${e?"checked":""} onchange="marcarTarea('${t.id}',this)" style="width:22px;height:22px"><span class="chk printonly">${e?"☑":"☐"}</span>` : `<span class="chk">${e?"☑":"☐"}</span>`}</td>
      <td class="c" style="font-size:10px">${e ? esc(e.por)+"<br>"+esc(fmtF(e.fecha)) : ""}</td></tr>`;
  }).join("");
  const cards = (C.tareas||[]).filter(t => (t.texto||"").trim()).map((t,i) => { const e = EJ[t.id]; return `<label class="card-t ${e?"hecho":""}"><span class="n">${i+1}</span>${ejecutable ? `<input type="checkbox" ${e?"checked":""} onchange="marcarTarea('${t.id}',this)">` : `<span class="chk">${e?"☑":"☐"}</span>`}<span class="tx"><small>${esc(t.tipo)}</small>${esc(t.texto)}${e?`<small>✔ ${esc(e.por)} · ${esc(fmtF(e.fecha))}</small>`:""}</span></label>`; }).join("");
  const filasM = (C.materiales||[]).filter(m => (m.descripcion||"").trim()).map(m => `<tr><td class="c">${esc(m.cantidad)}</td><td class="c">${esc(m.unidad)}</td><td>${esc(m.descripcion)}</td></tr>`).join("");
  const hall = (C.hallazgos||[]).map(h => `<div class="b" style="border-top:1px solid #ccc"><b>${esc(h.titulo)}:</b>\n${esc(h.texto)}</div>`).join("");
  const fotos = fotosRef();
  const marca = st === "Obsoleta" ? `<div style="text-align:center;font-weight:bold;color:#b91c1c;font-size:26px;border:3px solid #b91c1c;margin:6px 0">OBSOLETA — NO USAR</div>` : "";
  const header = `
    <table class="hd"><tr>
      <td class="logo" rowspan="3"><img src="${LOGO}" alt="SI"></td>
      <td class="tit" rowspan="2">CENTRO DE SERVICIO SI</td>
      <td class="lbl">FOLIO</td><td class="val">${esc(folioOT)}</td></tr>
      <tr><td class="lbl">FECHA</td><td class="val">${esc(fechaOT)}</td></tr>
      <tr><td class="sub">ORDEN DE TRABAJO · Rev. ${esc(ot.fields[T.rev]||1)}</td><td class="lbl">EQUIPO</td><td class="val">${esc(q.folio)}</td></tr></table>
    <table class="eq">
      <tr><td class="l">CLIENTE</td><td class="v">${esc(q.cliente)}</td><td class="l">USUARIO</td><td class="v">${esc(q.usuario)}</td><td class="l">HP</td><td class="v">${esc(q.hp)}</td></tr>
      <tr><td class="l">EQUIPO</td><td class="v">${esc(q.tipoEquipo)}</td><td class="l">MARCA</td><td class="v">${esc(q.marca)}</td><td class="l">FRAME</td><td class="v">${esc(q.frame)}</td></tr>
      <tr><td class="l">SPEC</td><td class="v">${esc(q.spec)}</td><td class="l">N/S</td><td class="v">${esc(q.serie)}</td><td class="l">VOLTS</td><td class="v">${esc(q.volts)}</td></tr>
    </table>`;
  el.innerHTML = `<div class="hoja"><table class="wrap"><thead><tr><td>${header}</td></tr></thead><tbody><tr><td>
    ${marca}
    <div class="sec"><div class="t">I. Objetivo y alcance</div><div class="b">${esc(C.objetivo)}</div><div class="b" style="border-top:1px solid #ccc;background:#f4f7fc"><b>Importante:</b> esta orden es solo una guía de apoyo, no un límite. Si durante la intervención se detecta algo adicional que haya que hacer, el técnico aplica su criterio, lo realiza y lo deja registrado en el reporte de servicio; si implica un costo o cambio importante, se avisa al encargado.</div></div>
    <div class="sec"><div class="t">II. Personal asignado</div>
      <table class="g"><tr><th>Función</th><th>Nombre</th><th>Puesto</th></tr>
      <tr><td class="c"><b>OPERACIÓN (ejecuta)</b></td><td class="c"><b>${esc(nomVis(tecnicoAsignado())||"— sin asignar —")}</b></td><td class="c">Técnico</td></tr>
      <tr><td class="c"><b>AUTORIZA (verifica)</b></td><td class="c"><b>${esc(ENCARGADO.nombre)}</b></td><td class="c">${esc(ENCARGADO.puesto)}</td></tr></table></div>
    ${hall ? `<div class="sec"><div class="t">III. Hallazgos del diagnóstico</div>${hall}</div>` : ""}
    <div class="sec"><div class="t">IV. Actividades a realizar (en este orden)</div>
      <div class="cards">${cards}</div><table class="g tareas"><tr><th style="width:5%">No.</th><th style="width:10%">Tipo</th><th>Instrucción al operador</th><th style="width:8%">Hecho</th><th style="width:16%">Por / fecha</th></tr>${filasT || `<tr><td colspan="5" class="c">Sin actividades</td></tr>`}</table></div>
    <div class="sec"><div class="t">V. Materiales asignados</div>
      <table class="g"><tr><th style="width:10%">Cant.</th><th style="width:12%">Unidad</th><th>Descripción</th></tr>${filasM || `<tr><td colspan="3" class="c">Sin materiales</td></tr>`}</table></div>
    ${(C.fueraAlcance||"").trim() ? `<div class="sec"><div class="t">VI. Indicaciones específicas (NO hacer)</div><div class="b">${esc(C.fueraAlcance)}</div></div>` : ""}
    ${fotos.length ? `<div class="sec" style="break-inside:avoid"><div class="t">VII. Fotos de referencia</div><div class="fotos">${fotos.map(f=>`<figure><img src="${esc(f.url)}" alt=""><figcaption>${esc(f.cap)}</figcaption></figure>`).join("")}</div></div>` : ""}
    <div class="sec" style="break-inside:avoid"><div class="t">VIII. Firmas</div><div class="firmas">
      ${bloqueFirma("encargado","AUTORIZA / SUPERVISIÓN",ENCARGADO.puesto,ENCARGADO.nombre)}
      ${bloqueFirma("tecnico","OPERACIÓN (ejecuta)","Técnico", nomVis(tecnicoAsignado()))}
    </div></div>
    <div class="pie"><span>CENTRO DE SERVICIO SI · ${esc(folioOT)}</span><span>Generada desde el diagnóstico${C.fechaDiagnostico?" del "+esc(fmtD(C.fechaDiagnostico)):""}. Estado: ${esc(st)}</span></div>
  </td></tr></tbody></table></div>`;
}

cargar();
</script>
</body>
</html>
